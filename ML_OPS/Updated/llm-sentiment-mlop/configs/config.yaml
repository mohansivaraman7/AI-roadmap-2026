# Central configuration for the sentiment classification project.
# Keeping config out of code means retraining with new hyperparameters
# never requires touching src/*.py.

data:
  raw_path: data/raw/sample_reviews.csv
  processed_dir: data/processed
  test_size: 0.2
  val_size: 0.1
  random_seed: 42

model:
  base_model: distilbert-base-uncased   # small open-source transformer LLM
  num_labels: 2
  max_length: 64

training:
  epochs: 3
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  output_dir: models/sentiment-classifier

mlflow:
  # A local SQLite database, not the plain "./mlruns" folder store: MLflow 3.x
  # puts the folder-based file store into maintenance mode and refuses to use
  # it by default. SQLite needs no separate server, still lives entirely in
  # this project folder, and works the same on MLflow 2.x and 3.x. Point this
  # at a real server/Postgres URI for a shared, multi-person deployment.
  tracking_uri: sqlite:///mlflow.db
  artifact_location: mlartifacts   # where model files themselves are stored
  experiment_name: sentiment-classification
  registered_model_name: sentiment-classifier
  production_alias: champion    # MLflow model alias used to mark the "live" model
